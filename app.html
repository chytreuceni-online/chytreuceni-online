<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uč se chytře</title></head><body style="margin:0;background:#07111f;color:white;font-family:system-ui"><div id="load" style="min-height:100vh;display:grid;place-items:center">Načítám Uč se chytře…</div><script src="d01.js"></script><script src="d02.js"></script><script src="d03.js"></script><script src="d04.js"></script><script src="g05_06.js"></script><script src="g07_08.js"></script><script src="g09_10.js"></script><script src="g11_12.js"></script><script src="g13_14.js"></script><script src="d15.js"></script><script src="d16.js"></script><script src="g17_18.js"></script><script src="g19_20.js"></script><script>(async()=>{try{const s=APP_CHUNKS.join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();t=t.replace('function topicQuestions(s,idx){const t=DATA[grade][term][s][idx],raw=uniqueByPrompt(t.questions),count=raw.length>6?6:raw.length;return shuffle(raw).slice(0,count).map(q=>variant(q,t.name))}','function topicQuestions(s,idx){const topics=DATA[grade][term][s]||[],t=topics[idx],target=15;if(!t)return[];const chosen=[],seen=new Set(),add=(q,topicName)=>{if(!q||seen.has(q[0]))return;seen.add(q[0]);chosen.push({q:variant(q,topicName),sub:s,topic:topicName})};shuffle(uniqueByPrompt(t.questions)).forEach(q=>add(q,t.name));if(chosen.length<target){const related=[];topics.forEach((other,j)=>{if(j===idx)return;const distance=Math.abs(j-idx);uniqueByPrompt(other.questions).forEach(q=>related.push({q,topic:other.name,distance}))});related.sort((a,b)=>a.distance-b.distance||Math.random()-.5);related.forEach(x=>{if(chosen.length<target)add(x.q,x.topic)})}return shuffle(chosen).slice(0,target)}').replace('<div class="topic-actions"><button class="primary big-action" onclick="startTopicTest()">📝 Spustit test tohoto tématu</button></div>','<div class="topic-actions"><button class="primary big-action" onclick="startTopicTest()">📝 Spustit test • 15 otázek</button><p class="muted" style="margin:10px 0 0">15 různých otázek: nejdřív toto téma, potom související učivo ze stejného předmětu.</p></div>');document.open();document.write(t);document.close()}catch(e){document.getElementById('load').innerHTML='<div style="padding:24px;text-align:center"><h2>Nepodařilo se spustit aplikaci</h2><p>Zkus aktualizovat prohlížeč.</p></div>';console.error(e)}})();</script></body></html>
