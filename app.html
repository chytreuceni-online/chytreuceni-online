<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uč se chytře</title></head><body style="margin:0;background:#07111f;color:white;font-family:system-ui"><div id="load" style="min-height:100vh;display:grid;place-items:center">Načítám Uč se chytře…</div><script src="d01.js"></script><script src="d02.js"></script><script src="d03.js"></script><script src="d04.js"></script><script src="g05_06.js"></script><script src="g07_08.js"></script><script src="g09_10.js"></script><script src="g11_12.js"></script><script src="g13_14.js"></script><script src="d15.js"></script><script src="d16.js"></script><script src="g17_18.js"></script><script src="g19_20.js"></script><script>(async()=>{try{const s=APP_CHUNKS.join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('load').innerHTML='<div style="padding:24px;text-align:center"><h2>Nepodařilo se spustit aplikaci</h2><p>Zkus aktualizovat prohlížeč.</p></div>';console.error(e)}})();</script></body></html>
