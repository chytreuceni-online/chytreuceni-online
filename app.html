<script>(async()=>{const fail=e=>{console.error(e);document.getElementById('load').innerHTML='<div><h2>Nepodařilo se spustit aplikaci</h2><p>Obnov stránku a zkus to znovu.</p><small style="opacity:.65">Chyba: '+String(e&&e.message||e)+'</small></div>'};const loadPako=()=>new Promise((resolve,reject)=>{if(window.pako)return resolve();const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';x.onload=resolve;x.onerror=()=>reject(new Error('Nepodařilo se načíst záložní rozbalovač'));document.head.appendChild(x)});try{if(!Array.isArray(window.UC_V5)||window.UC_V5.length!==19)throw new Error('Chybí část dat aplikace ('+(window.UC_V5?window.UC_V5.length:0)+'/19)');const s=window.UC_V5.join('');if(s.length!==135724)throw new Error('Data aplikace nejsou kompletní ('+s.length+'/135724)');if(s.length%4!==0||!/^[A-Za-z0-9+/]*={0,2}$/.test(s))throw new Error('Data aplikace mají neplatný Base64 formát');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));let t='',ok=false;if('DecompressionStream'in window){try{const ds=new DecompressionStream('gzip');t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();ok=true}catch(e){console.warn('Nativní gzip selhal',e)}}if(!ok){await loadPako();t=new TextDecoder().decode(window.pako.ungzip(b))}if(!t.includes('Uč se chytře'))throw new Error('Aplikace se nerozbalila správně');document.open();document.write(t);document.close()}catch(e){fail(e)}})();</script></body></html>
