<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Uč se chytře</title></head><body style="margin:0;background:#07111f;color:#f4f8ff;font-family:system-ui"><div id="load" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">Načítám Uč se chytře…</div><script src="v4_g01.js"></script><script src="v4_g02.js"></script><script src="v4_g03.js"></script><script src="v4_g04.js"></script><script src="v4_g05.js"></script><script>(async()=>{try{const s=(window.UC_APP_CHUNKS||[]).join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('DecompressionStream není podporován');const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('load').innerHTML='<div><h2>Nepodařilo se spustit aplikaci</h2><p>Aktualizuj prohlížeč na novější verzi a zkus to znovu.</p></div>';console.error(e)}})();</script></body></html>
